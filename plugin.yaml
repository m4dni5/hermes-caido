name: caido
version: 0.7.1
description: Caido HTTP proxy integration — search, replay, automate campaigns, findings, export curl, auth setup.

Session orientation is automatic: the first read call returns project/scope context.
author: matt
provides_tools:
  - caido_health
  - caido_search
  - caido_recent
  - caido_get
  - caido_findings
  - caido_create_finding
  - caido_delete_finding
  - caido_replay
  - caido_automate
  - caido_automate_status
  - caido_export_curl
  - caido_auth_setup
provides_skills:
  - caido
requires_env:
  - name: CAIDO_PAT
    description: "Caido Personal Access Token (required — all instances, including local, require auth)"
    secret: true
    optional: true
  - name: CAIDO_URL
    description: "Caido instance URL (e.g. https://caido.example.com or http://127.0.0.1:8080)"
