[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-caido"
version = "0.7.0"
description = "Hermes Agent plugin for the Caido HTTP proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[tool.setuptools]
packages = ["caido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
